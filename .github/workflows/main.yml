name: DILA-MD Bot

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check environment
        run: |
          node --version
          npm --version
          test -n "$SESSION_ID" && echo "SESSION_ID is set" || echo "SESSION_ID is missing"
        env:
          SESSION_ID: ${{ secrets.SESSION_ID }}

      - name: Start Bot
        env:
          SESSION_ID: ${{ secrets.SESSION_ID }}
        run: npm start

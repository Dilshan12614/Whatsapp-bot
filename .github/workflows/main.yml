name: DILA-MD Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check environment
        env:
          SESSION_ID: ${{ secrets.SESSION_ID }}
        run: |
          node --version
          npm --version

          if [ -z "$SESSION_ID" ]; then
            echo "SESSION_ID is missing"
            exit 1
          else
            echo "SESSION_ID is set"
          fi

      - name: Start Bot
        env:
          SESSION_ID: ${{ secrets.SESSION_ID }}
        run: npm start
